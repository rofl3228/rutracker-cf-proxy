name: Update RuTracker forum list

on:
  schedule:
    - cron: "17 4 * * 1"  # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-forums
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Refresh forum list and categories
        id: update
        run: python scripts/update_forums.py --summary "$RUNNER_TEMP/forums-summary.md"

      # The PR carries its own patch release: once merged, the Release workflow tags it,
      # creates the GitHub release and publishes the images.
      - name: Bump patch version
        id: bump
        if: steps.update.outputs.changed == 'true'
        run: |
          VERSION=$(python scripts/bump_version.py patch)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          printf '\nMerging this PR releases **v%s** (tag, GitHub release and images are created automatically).\n' "$VERSION" \
            >> "$RUNNER_TEMP/forums-summary.md"

      # Pull requests opened with GITHUB_TOKEN do not trigger other workflows,
      # so the test suite runs here before the PR is created.
      - name: Test
        if: steps.update.outputs.changed == 'true'
        run: python -m pytest -q

      - name: Open or update pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-forums
          delete-branch: true
          commit-message: Update RuTracker forum list and categories, release ${{ steps.bump.outputs.version }}
          title: Update RuTracker forum list (v${{ steps.bump.outputs.version }})
          body-path: ${{ runner.temp }}/forums-summary.md
          add-paths: |
            definitions/rutracker_forums.tsv
            src/rutracker_proxy/definitions/rutracker-proxy.yml
            pyproject.toml
            src/rutracker_proxy/__init__.py
