name: Update RuTracker forum list

on:
  schedule:
    - cron: "17 4 * * 1"  # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-forums
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Refresh forum list and categories
        id: update
        run: python scripts/update_forums.py --summary "$RUNNER_TEMP/forums-summary.md"

      # Pull requests opened with GITHUB_TOKEN do not trigger other workflows,
      # so the test suite runs here before the PR is created.
      - name: Test
        if: steps.update.outputs.changed == 'true'
        run: python -m pytest -q

      - name: Open or update pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-forums
          delete-branch: true
          commit-message: Update RuTracker forum list and categories
          title: Update RuTracker forum list
          body-path: ${{ runner.temp }}/forums-summary.md
          add-paths: |
            definitions/rutracker_forums.tsv
            src/rutracker_proxy/definitions/rutracker-proxy.yml
