name: Release

# When a version bump lands in main (the forum update PR bumps the patch version, or pyproject.toml is
# edited by hand), tag it, create the GitHub release and publish the versioned images.
on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        run: echo "version=$(python scripts/bump_version.py --current)" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION already exists, nothing to release"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "rutracker-cf-proxy $VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes --latest \
            --notes "Images (linux/amd64, linux/arm64):
          - \`ghcr.io/${GITHUB_REPOSITORY}:$VERSION\`
          - \`kirfeo/rutracker-cf-proxy:$VERSION\`"
          echo "created=true" >> "$GITHUB_OUTPUT"

  image:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets: inherit
