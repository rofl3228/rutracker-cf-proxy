  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    music-search: [q]
    book-search: [q]

settings:
  - name: username
    type: text
    label: Username
  - name: password
    type: password
    label: Password
  - name: info_proxy
    type: info
    label: About
    default: "Requests go to rutracker-proxy (Site Link above), which passes Cloudflare. Do not add a FlareSolverr tag to this indexer."
  - name: stripcyrillic
    type: checkbox
    label: Strip Russian title (keep only the original/English name for Radarr/Sonarr)
    default: true
  - name: addrus
    type: checkbox
    label: Append RUS to titles with Russian audio (Dub/MVO/DVO/AVO/VO)
    default: true
  - name: sort
    type: select
    label: Sort requested from site
    default: 1
    options:
      1: created
      10: seeders
      7: size
      2: title
  - name: type
    type: select
    label: Order requested from site
    default: 2
    options:
      2: desc
      1: asc

login:
  path: forum/login.php
  method: form
  form: form#login-form-full
  captcha:
    type: image
    selector: img[src*="/captcha/"]
    input: input[name^="cap_code_"]
  inputs:
    login_username: "{{ .Config.username }}"
    login_password: "{{ .Config.password }}"
  selectorinputs:
    cap_sid:
      selector: input[name="cap_sid"]
      attribute: value
      optional: true
  error:
    - selector: h4.warnColor1.tCenter.mrg_16
    - selector: div.msg-main
  test:
    path: forum/index.php
    selector: "#logged-in-username"

search:
  paths:
    - path: forum/tracker.php
  inputs:
    $raw: "{{ range .Categories }}f[]={{.}}&{{end}}"
    nm: "{{ .Keywords }}"
    o: "{{ .Config.sort }}"
    s: "{{ .Config.type }}"

  keywordsfilters:
    # Sonarr appends S01 / S01E02; RuTracker titles use "Сезон: 1 / Серии: ..." instead.
    - name: re_replace
      args: ['\bS\d{1,3}(?:E\d{1,4})?\b', " "]
    - name: re_replace
      args: ['[^\p{L}\p{N}]+', " "]
    - name: trim

  rows:
    selector: table#tor-tbl > tbody > tr:has(a.tr-dl)

  fields:
    category:
      selector: td.f-name-col a
      attribute: href
      filters:
        - name: querystring
          args: f
    title:
      selector: a.tLink
      filters:
        # Title filters are exercised by tests/test_definition.py against real RuTracker titles.
        - name: re_replace
          args: ['\s+', " "]
        # --- Season/episode info -> SxxEyy ---
        # "Сезон: 1,2,3" -> "Сезон: 1-3"
        - name: re_replace
          args: ['Сезон: (\d+)(?:\s*,\s*\d+)*\s*,\s*(\d+)', "Сезон: $1-$2"]
        # zero-pad single digits after "Сезон: ", "Серии: " (both ends of a range) and "из "
        - name: re_replace
          args: ['(?<=(?:Сезон|Серии): (?:\d+-)?)(\d)(?!\d)', "0$1"]
        - name: re_replace
          args: ['(?<=Серии: \d+(?:-\d+)? из )(\d)(?!\d)', "0$1"]
        # whole season(s): "Сезон: 03 / Серии: 01-10 из 10" -> "S03"
        - name: re_replace
          args: [' / Сезон: (\d+(?:-\d+)?) / Серии: 01-(\d+) из \2(?!\d)', " S$1"]
        # "Сезон: 03 / Серии: 01-08 из 10" -> "S03E01-E08"
        - name: re_replace
          args: [' / Сезон: (\d+) / Серии: (\d+)-(\d+)(?: из \d+)?', " S$1E$2-E$3"]
        # "Сезон: 01 / Серии: 08 из 11" -> "S01E08"
        - name: re_replace
          args: [' / Сезон: (\d+) / Серии: (\d+)(?: из \d+)?', " S$1E$2"]
        # several seasons with a partial episode list -> just the seasons
        - name: re_replace
          args: [' / Сезон: (\d+-\d+) / Серии: [^(\[]*', " S$1 "]
        # episodes without a season: assume season 1
        - name: re_replace
          args: [' / Серии: 01-(\d+) из \1(?!\d)', " S01"]
        - name: re_replace
          args: [' / Серии: (\d+)-(\d+)(?: из \d+)?', " S01E$1-E$2"]
        - name: re_replace
          args: [' / Серии: (\d+)(?: из \d+)?', " S01E$1"]
        - name: re_replace
          args: [' / Сезон: (\d+(?:-\d+)?)', " S$1"]
        # "S02-03" -> "S02-S03"
        - name: re_replace
          args: ['\bS(\d{2,})-(\d{2,})\b', "S$1-S$2"]
        # --- Names ---
        # drop "(director / Director)" right before the [year, ...] block
        - name: re_replace
          args: ['\s*\((?:[^()]|\([^()]*\))*\)\s*(?=\[)', " "]
        # drop leading Cyrillic names: "Кэти уезжает / Katie Says Goodbye" -> "Katie Says Goodbye"
        - name: re_replace
          args: ['^((?:[^/\[]*?\p{IsCyrillic}[^/\[]*?\s/\s)+)', "{{ if .Config.stripcyrillic }}{{ else }}$1{{ end }}"]
        # several remaining alternative names: keep the first ("Fauda / פאודה S05" -> "Fauda S05")
        - name: re_replace
          args: ['^((?![\[(])[^/\[]+?)(\s/\s[^/\[]+?)+(?=\sS\d{2}|\s\[)', "{{ if .Config.stripcyrillic }}$1{{ else }}$0{{ end }}"]
        # --- [year, country, genre, quality] -> "year [quality]" ---
        - name: re_replace
          args: ['(?<=\[\d{4}(?:-\d{4})?(?:,[^,\]]*)*),\s*\p{IsCyrillic}[^,\]A-Za-z0-9]*(?=[,\]])', ""]
        - name: re_replace
          args: ['\[(\d{4}(?:-\d{4})?)(?:,\s*)?([^\]]*)\]', "$1 [$2]"]
        - name: re_replace
          args: ['\s\[\]', ""]
        # Sonarr misreads "Silo S03 2026 [...]" as series "Silo S03": drop the year after SxxEyy
        - name: re_replace
          args: ['(\bS\d{2}(?:E\d{2,})?(?:-[SE]\d{2,})?)(?:\s\(\d+\))?\s\d{4}(?:-\d{4})?\b', "$1"]
        # --- RuTracker quality names -> ones Radarr/Sonarr recognise (checked via their parse API) ---
        - name: re_replace
          args: ['\bWEB-DLRip\b', "WEBRip"]
        - name: re_replace
          args: ['\bDVDRemux\b', "DVDRip"]
        - name: re_replace
          args: ['\bHDTVRip\b', "HDTV"]
        - name: re_replace
          args: ['\b(?:SATRip|IPTVRip|TVRip|DVB)\b', "SDTV"]
        # --- Russian audio marker for Radarr/Sonarr language detection ---
        - name: re_replace
          args: ['^(?=.*\b(?:Dub|MVO|DVO|AVO|VO)\b)(.+)$', "{{ if .Config.addrus }}$1 RUS{{ else }}$1{{ end }}"]
        - name: re_replace
          args: ['\s+', " "]
        - name: trim
    details:
      selector: a.tLink
      attribute: href
      filters:
        - name: prepend
          args: "https://rutracker.org/forum/"
    download:
      selector: a.tr-dl
      attribute: href
    size:
      selector: td.tor-size
      attribute: data-ts_text
    date:
      # unix timestamp
      selector: td:last-child
      attribute: data-ts_text
    seeders:
      selector: b.seedmed
      optional: true
      default: 0
    leechers:
      selector: td.leechmed
    grabs:
      selector: td.number-format
    downloadvolumefactor:
      text: 1
    uploadvolumefactor:
      text: 1
# engine TorrentPier (rutracker fork)
